name: native-pr

on:
  pull_request:
    paths:
      - "src/**"
      - "autotest/**"
      - "3rdparty/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "resources.qrc"
      - "icons.qrc"
      - "packaging/toolchain-lock.json"
      - ".github/workflows/native-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.variant }} native
    strategy:
      fail-fast: false
      matrix:
        variant: [Core, Full]
    runs-on: [self-hosted, thothpad, windows, "repro-a"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
      - name: Provision locked build tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check cmake==4.3.2 ninja==1.13.0
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build-native-pr -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTHOTHPAD_PACKAGE_VARIANT=${{ matrix.variant }}
          -DTHOTHPAD_BUNDLE_ENGINE=OFF
      - name: Verify toolchain
        shell: pwsh
        run: >-
          python packaging/verify_toolchain.py --lock packaging/toolchain-lock.json windows
          --craft-root C:\CraftRoot --build-dir build-native-pr
          --python (Get-Command python.exe).Source
          --cmake (Get-Command cmake.exe).Source
          --ninja (Get-Command ninja.exe).Source
      - name: Build
        shell: pwsh
        run: cmake --build build-native-pr --config Release
      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_PLUGIN_PATH: C:\CraftRoot\plugins
          QT_QPA_PLATFORM_PLUGIN_PATH: C:\CraftRoot\plugins\platforms
        run: ctest --test-dir build-native-pr -C Release --output-on-failure

  linux:
    name: Linux ${{ matrix.variant }} native
    strategy:
      fail-fast: false
      matrix:
        variant: [Core, Full]
    runs-on: [self-hosted, thothpad, linux, "repro-a"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
      - name: Provision locked build tools
        run: python3 -m pip install --disable-pip-version-check cmake==4.3.2 ninja==1.13.0
      - name: Configure
        run: >-
          cmake -S . -B build-native-pr -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTHOTHPAD_PACKAGE_VARIANT=${{ matrix.variant }}
          -DTHOTHPAD_BUNDLE_ENGINE=OFF
      - name: Verify toolchain
        run: >-
          python3 packaging/verify_toolchain.py --lock packaging/toolchain-lock.json linux
          --build-dir build-native-pr
          --python "$(command -v python3)"
          --cmake "$(command -v cmake)"
          --ninja "$(command -v ninja)"
          --qtpaths "$(command -v qtpaths6)"
      - name: Build
        run: cmake --build build-native-pr
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-native-pr --output-on-failure

  macos:
    name: macOS ${{ matrix.variant }} native
    strategy:
      fail-fast: false
      matrix:
        variant: [Core, Full]
    runs-on: [self-hosted, thothpad, macos, "repro-a"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
      - name: Provision locked build tools
        run: python3 -m pip install --disable-pip-version-check cmake==4.3.2 ninja==1.13.0
      - name: Configure
        run: >-
          cmake -S . -B build-native-pr -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTHOTHPAD_PACKAGE_VARIANT=${{ matrix.variant }}
          -DTHOTHPAD_BUNDLE_ENGINE=OFF
      - name: Verify toolchain
        run: >-
          python3 packaging/verify_toolchain.py --lock packaging/toolchain-lock.json macos
          --build-dir build-native-pr
          --python "$(command -v python3)"
          --cmake "$(command -v cmake)"
          --ninja "$(command -v ninja)"
          --qtpaths "$(command -v qtpaths6)"
          --macdeployqt "$(command -v macdeployqt)"
          --xcodebuild "$(command -v xcodebuild)"
      - name: Build
        run: cmake --build build-native-pr
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-native-pr --output-on-failure
