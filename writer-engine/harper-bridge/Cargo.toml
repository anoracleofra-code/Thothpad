[package]
name = "thothpad-harper"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
harper-core = { version = "=2.5.0", default-features = false }
harper-brill = "=2.5.0"
harper-pos-utils = "=2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
